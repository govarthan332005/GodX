<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5B2DE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bachat — Save & Earn Cashback</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════ SPLASH ══════════ -->
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 48 48" width="64" height="64"><rect x="4" y="4" width="40" height="40" rx="12" fill="#fff" opacity=".15"/><path d="M24 12c-5 0-9 3.4-9 8 0 3 1.8 5.3 4.5 6.6L18 36l6-3 6 3-1.5-9.4C31.2 25.3 33 23 33 20c0-4.6-4-8-9-8z" fill="#fff"/><circle cx="24" cy="20" r="3.4" fill="#5B2DE0"/></svg>
  </div>
  <div class="splash-name">Bachat</div>
  <div class="splash-tag">Save smart. Earn cashback.</div>
  <div class="splash-loader"><i></i></div>
</div>

<!-- ══════════ AUTH ══════════ -->
<div id="auth-view" class="hidden">
  <div class="auth-hero">
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" width="52" height="52"><rect x="4" y="4" width="40" height="40" rx="12" fill="#fff" opacity=".18"/><path d="M24 12c-5 0-9 3.4-9 8 0 3 1.8 5.3 4.5 6.6L18 36l6-3 6 3-1.5-9.4C31.2 25.3 33 23 33 20c0-4.6-4-8-9-8z" fill="#fff"/><circle cx="24" cy="20" r="3.4" fill="#5B2DE0"/></svg>
    </div>
    <h1>Bachat</h1>
    <p>Micro-savings with real cashback rewards</p>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button id="tab-login" class="auth-tab active" type="button">Login</button>
      <button id="tab-signup" class="auth-tab" type="button">Sign Up</button>
    </div>

    <form id="form-login" class="auth-form" autocomplete="off">
      <label class="field"><span>Email</span><input type="email" id="login-email" required placeholder="you@example.com"></label>
      <label class="field"><span>Password</span><input type="password" id="login-pass" required placeholder="••••••••"></label>
      <button class="btn btn-primary btn-block" type="submit">Login</button>
    </form>

    <form id="form-signup" class="auth-form hidden" autocomplete="off">
      <label class="field"><span>Full Name</span><input type="text" id="su-name" required placeholder="Rahul Sharma"></label>
      <label class="field"><span>Phone</span><input type="tel" id="su-phone" required placeholder="98765 43210"></label>
      <label class="field"><span>Email</span><input type="email" id="su-email" required placeholder="you@example.com"></label>
      <label class="field"><span>Password</span><input type="password" id="su-pass" required minlength="6" placeholder="Min 6 characters"></label>
      <label class="field"><span>Referral Code <em>(optional)</em></span><input type="text" id="su-ref" placeholder="e.g. BACHAT123"></label>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      <p class="auth-note">By signing up you agree to our Terms &amp; Privacy Policy. 100% transparent — no hidden charges, ever.</p>
    </form>
  </div>
</div>

<!-- ══════════ APP SHELL ══════════ -->
<div id="app" class="hidden">
  <header id="app-header"></header>

  <main id="main">
    <section id="view-home" class="view"></section>
    <section id="view-plans" class="view hidden"></section>
    <section id="view-wallet" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="home" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-view="plans" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7zm0 2.3L18.7 8 12 11.7 5.3 8zM5 9.8l6 3.4v6.5l-6-3.4zm8 9.9v-6.5l6-3.4v6.5z"/></svg>
      <span>Plans</span>
    </button>
    <button class="nav-btn" data-view="wallet" type="button">
      <svg viewBox="0 0 24 24"><path d="M20 7V6a2 2 0 0 0-2-2H5a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h15a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM5 6h13v1H5a1 1 0 0 1 0-2zm11 7.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      <span>Wallet</span>
    </button>
    <button class="nav-btn" data-view="settings" type="button">
      <svg viewBox="0 0 24 24"><path d="m19.4 13 .1-1-.1-1 2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L14.9 3h-4L10.5 6a8 8 0 0 0-1.7 1l-2.4-1-2 3.5L6.4 11l-.1 1 .1 1-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.4 3h4l.4-3a8 8 0 0 0 1.7-1l2.4 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<!-- fullscreen loader overlay -->
<div id="loader-overlay">
  <div class="lo-logo">
    <svg viewBox="0 0 48 48" width="52" height="52"><rect width="48" height="48" rx="13" fill="#5B2DE0"/><path d="M24 12c-5 0-9 3.4-9 8 0 3 1.8 5.3 4.5 6.6L18 36l6-3 6 3-1.5-9.4C31.2 25.3 33 23 33 20c0-4.6-4-8-9-8z" fill="#fff"/><circle cx="24" cy="20" r="3.4" fill="#5B2DE0"/></svg>
  </div>
  <div class="lo-ring"></div>
  <div class="lo-txt" style="font-weight:700;color:var(--ink);font-size:.9rem">Working…</div>
</div>

<!-- modal + toast roots -->
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
